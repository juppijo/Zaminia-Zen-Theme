<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB & Farb-Highlight Analyse-App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            color: #f8fafc;
        }

        #app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #canvas-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
        }

        #canvas-wrapper:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
            image-rendering: crisp-edges;
        }

        /* Toggle Button für das Panel */
        #toggle-panel-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
            transition: all 0.2s ease;
        }

        #toggle-panel-btn:hover {
            background: rgba(51, 65, 85, 0.95);
            transform: scale(1.02);
        }

        /* Glassmorphism Bedienfeld */
        #control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 360px;
            max-height: calc(100vh - 40px);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            z-index: 99;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.7);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        }

        #control-panel.collapsed {
            transform: translateX(120%) scale(0.95);
            opacity: 0;
            pointer-events: none;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .panel-header h2 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 1.25rem;
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
        }

        .close-btn:hover {
            color: #f8fafc;
            background: rgba(255, 255, 255, 0.1);
        }

        .section-group {
            margin-bottom: 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 12px;
        }

        .section-group h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #475569;
        }

        .btn-accent {
            background: #8b5cf6;
        }

        .btn-success {
            background: #10b981;
        }

        .btn-danger {
            background: #ef4444;
        }

        /* Checkbox Toggles für RGB */
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.95krem;
        }

        .toggle-row:last-child {
            margin-bottom: 0;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #475569;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #3b82f6;
        }

        input#toggle-r:checked + .slider { background-color: #ef4444; }
        input#toggle-g:checked + .slider { background-color: #10b981; }
        input#toggle-b:checked + .slider { background-color: #3b82f6; }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* Regler & Sliders */
        .slider-control {
            margin-bottom: 10px;
        }

        .slider-control:last-child {
            margin-bottom: 0;
        }

        .slider-control label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 4px;
        }

        .slider-control input[type="range"] {
            width: 100%;
            accent-color: #3b82f6;
            cursor: pointer;
        }

        /* Isolations-Info & Vorschau */
        #isolation-preview-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        #color-preview-sample {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.3);
            background: #000;
        }

        /* Resize Inputs */
        .resize-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .input-group input, .input-group select {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }

        .input-group input:focus {
            border-color: #3b82f6;
        }

        /* Modal für Kamera */
        #camera-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
            gap: 15px;
        }

        #camera-video {
            max-width: 90vw;
            max-height: 70vh;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .camera-actions {
            display: flex;
            gap: 10px;
        }

        /* Scrollbar Design */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- Canvas Arbeitsbereich -->
        <div id="canvas-wrapper" id="drop-area">
            <canvas id="imageCanvas"></canvas>
        </div>

        <!-- Button zum Öffnen/Schließen des Panels -->
        <button id="toggle-panel-btn">⚙️ Steuerung</button>

        <!-- Einklappbares Bedienfeld -->
        <div id="control-panel">
            <div class="panel-header">
                <h2>Farb- & Bildanalyse</h2>
                <button class="close-btn" id="close-panel-btn">&times;</button>
            </div>

            <!-- Bildquelle -->
            <div class="section-group">
                <h3>Bildquelle</h3>
                <div class="btn-grid" style="margin-bottom: 8px;">
                    <button class="btn btn-secondary" id="btn-load-test">🎨 Testbild</button>
                    <button class="btn btn-accent" id="btn-open-camera">📷 Kamera</button>
                </div>
                <div class="btn-grid">
                    <button class="btn" id="btn-upload">📁 Datei laden</button>
                    <button class="btn btn-success" id="btn-save">💾 Speichern</button>
                </div>
                <input type="file" id="file-input" accept="image/*" style="display: none;">
            </div>

            <!-- Bildgröße anpassen -->
            <div class="section-group">
                <h3>Bildgröße anpassen</h3>
                <div class="resize-grid">
                    <div class="input-group">
                        <label>Modus</label>
                        <select id="resize-mode">
                            <option value="percent">Prozent (%)</option>
                            <option value="pixel">Pixel (px)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label id="width-label">Breite (%)</label>
                        <input type="number" id="resize-width" value="100" min="1" max="10000">
                    </div>
                </div>
                <div class="resize-grid" id="height-container" style="display: none;">
                    <div class="input-group">
                        <label>Höhe (px)</label>
                        <input type="number" id="resize-height" value="100" min="1" max="10000">
                    </div>
                    <div class="input-group" style="justify-content: flex-end;">
                        <label style="display:flex; align-items:center; gap:5px; margin-top:14px; cursor:pointer; font-size:0.8rem;">
                            <input type="checkbox" id="aspect-ratio-lock" checked> Seitenverhältnis
                        </label>
                    </div>
                </div>
                <button class="btn btn-secondary" id="btn-apply-resize" style="width:100%; margin-top:6px;">Größe anwenden</button>
            </div>

            <!-- Speichertiefe & Format -->
            <div class="section-group">
                <h3>Export Format</h3>
                <div class="resize-grid">
                    <div class="input-group">
                        <label>Format</label>
                        <select id="export-format">
                            <option value="image/png">PNG</option>
                            <option value="image/jpeg">JPG</option>
                        </select>
                    </div>
                    <div class="input-group" id="jpg-quality-group">
                        <label>JPG Qualität (<span id="quality-val">90</span>%)</label>
                        <input type="range" id="export-quality" min="10" max="100" value="90">
                    </div>
                </div>
            </div>

            <!-- RGB Hauptschalter -->
            <div class="section-group">
                <h3>RGB Kanäle</h3>
                <div class="toggle-row">
                    <span>Rot-Kanal</span>
                    <label class="switch"><input type="checkbox" id="toggle-r" checked><span class="slider"></span></label>
                </div>
                <div class="toggle-row">
                    <span>Grün-Kanal</span>
                    <label class="switch"><input type="checkbox" id="toggle-g" checked><span class="slider"></span></label>
                </div>
                <div class="toggle-row">
                    <span>Blau-Kanal</span>
                    <label class="switch" style="margin-top:4px;"><input type="checkbox" id="toggle-b" checked><span class="slider"></span></label>
                </div>
            </div>

            <!-- Farbisolation & Pipette -->
            <div class="section-group">
                <h3>Farbisolation (Pipette)</h3>
                <button class="btn btn-accent" id="btn-picker" style="width:100%; margin-bottom:8px;">🎯 Farbe mit Pipette wählen</button>
                <div id="isolation-preview-box" style="display:none;">
                    <div id="color-preview-sample"></div>
                    <div style="font-size:0.85rem;" id="color-info-text">Keine Farbe ausgewählt</div>
                </div>
                <button class="btn btn-secondary" id="btn-reset-isolation" style="width:100%; margin-top:8px; display:none;">Isolation zurücksetzen</button>
            </div>

            <!-- Regler & Filter -->
            <div class="section-group">
                <h3>Anpassungs-Regler</h3>
                
                <div class="slider-control">
                    <label><span>Farbtoleranz</span><span id="val-tolerance">35</span></label>
                    <input type="range" id="range-tolerance" min="1" max="150" value="35">
                </div>

                <div class="slider-control">
                    <label><span>Inaktive Abdunkelung</span><span id="val-dim">80</span>%</label>
                    <input type="range" id="range-dim" min="0" max="100" value="80">
                </div>

                <div class="slider-control">
                    <label><span>Helligkeit</span><span id="val-brightness">0</span></label>
                    <input type="range" id="range-brightness" min="-100" max="100" value="0">
                </div>

                <div class="slider-control">
                    <label><span>Kontrast</span><span id="val-contrast">0</span></label>
                    <input type="range" id="range-contrast" min="-100" max="100" value="0">
                </div>

                <div class="slider-control">
                    <label><span>Sättigung</span><span id="val-saturation">0</span></label>
                    <input type="range" id="range-saturation" min="-100" max="100" value="0">
                </div>
            </div>
        </div>
    </div>

    <!-- Kamera Modal -->
    <div id="camera-modal">
        <video id="camera-video" autoplay playsinline></video>
        <div class="camera-actions">
            <button class="btn btn-success" id="btn-capture-photo">📸 Foto aufnehmen</button>
            <button class="btn btn-danger" id="btn-close-camera">Abbrechen</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const wrapper = document.getElementById('canvas-wrapper');
        
        let originalImage = null;
        let sourceImageWidth = 0;
        let sourceImageHeight = 0;

        // Zoom & Pan Variablen
        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX, startY;

        // Farb-Pipette & Isolations-Variablen
        let pickerActive = false;
        let targetColor = null; // {r, g, b}

        // Kamera Stream
        let mediaStream = null;

        // --- Panel Toggle ---
        const panel = document.getElementById('control-panel');
        document.getElementById('toggle-panel-btn').addEventListener('click', () => panel.classList.toggle('collapsed'));
        document.getElementById('close-panel-btn').addEventListener('click', () => panel.classList.add('collapsed'));

        // --- Testbild Generator ---
        function loadTestImage() {
            const w = 800, h = 600;
            const offCanvas = document.createElement('canvas');
            offCanvas.width = w;
            offCanvas.height = h;
            const oCtx = offCanvas.getContext('2d');

            // Hintergrund-Farbverlauf & Muster
            const grad = oCtx.createLinearGradient(0, 0, w, h);
            grad.addColorStop(0, '#ff3366');
            grad.addColorStop(0.5, '#33ccff');
            grad.addColorStop(1, '#ffcc00');
            oCtx.fillStyle = grad;
            oCtx.fillRect(0, 0, w, h);

            // Kreise und Formen in den Primär-/Sekundärfarben
            oCtx.fillStyle = 'rgba(255, 0, 0, 0.8)';
            oCtx.beginPath(); oCtx.arc(200, 200, 120, 0, Math.PI * 2); oCtx.fill();

            oCtx.fillStyle = 'rgba(0, 255, 0, 0.8)';
            oCtx.beginPath(); oCtx.arc(400, 250, 120, 0, Math.PI * 2); oCtx.fill();

            oCtx.fillStyle = 'rgba(0, 0, 255, 0.8)';
            oCtx.beginPath(); oCtx.arc(300, 380, 120, 0, Math.PI * 2); oCtx.fill();

            oCtx.fillStyle = '#ffffff';
            oCtx.font = 'bold 36px sans-serif';
            oCtx.textAlign = 'center';
            oCtx.fillText('RGB & Farbanalyse Testbild', w / 2, 80);

            const img = new Image();
            img.onload = () => {
                originalImage = img;
                sourceImageWidth = img.width;
                sourceImageHeight = img.height;
                resetViewAndProcess();
            };
            img.src = offCanvas.toDataURL();
        }

        function resetViewAndProcess() {
            if (!originalImage) return;
            scale = Math.min((wrapper.clientWidth * 0.85) / originalImage.width, (wrapper.clientHeight * 0.85) / originalImage.height);
            if (scale > 1) scale = 1;
            panX = (wrapper.clientWidth - originalImage.width * scale) / 2;
            panY = (wrapper.clientHeight - originalImage.height * scale) / 2;
            processImage();
        }

        // --- Bildverarbeitung & Hauptrender-Loop ---
        function processImage() {
            if (!originalImage) return;

            canvas.width = sourceImageWidth;
            canvas.height = sourceImageHeight;

            // 1. Originales Bild zeichnen
            ctx.drawImage(originalImage, 0, 0, sourceImageWidth, sourceImageHeight);

            // 2. Pixeldaten holen
            const imgData = ctx.getImageData(0, 0, sourceImageWidth, sourceImageHeight);
            const data = imgData.data;

            // Einstellungen auslesen
            const useR = document.getElementById('toggle-r').checked;
            const useG = document.getElementById('toggle-g').checked;
            const useB = document.getElementById('toggle-b').checked;

            const tolerance = parseInt(document.getElementById('range-tolerance').value);
            const dimFactor = (100 - parseInt(document.getElementById('range-dim').value)) / 100;
            const brightness = parseInt(document.getElementById('range-brightness').value);
            const contrast = parseInt(document.getElementById('range-contrast').value);
            const saturation = parseInt(document.getElementById('range-saturation').value) / 100;

            const factor = contrast === 0 ? 1 : (259 * (contrast + 255)) / (255 * (259 - contrast));

            for (let i = 0; i < data.length; i += 4) {
                let r = data[i];
                let g = data[i + 1];
                let b = data[i + 2];

                // Kanal-Schalter anwenden (nicht aktive Kanäle auf 0 setzen)
                let cr = useR ? r : 0;
                let cg = useG ? g : 0;
                let cb = useB ? b : 0;

                let isHighlighted = true;

                // Farbisolation via Pipette prüfen
                if (targetColor) {
                    const dist = Math.sqrt(
                        Math.pow(cr - targetColor.r, 2) +
                        Math.pow(cg - targetColor.g, 2) +
                        Math.pow(cb - targetColor.b, 2)
                    );
                    if (dist > tolerance) {
                        isHighlighted = false;
                    }
                }

                // Helligkeit, Kontrast, Sättigung anwenden
                // Helligkeit
                cr += brightness; cg += brightness; cb += brightness;

                // Kontrast
                if (contrast !== 0) {
                    cr = factor * (cr - 128) + 128;
                    cg = factor * (cg - 128) + 128;
                    cb = factor * (cb - 128) + 128;
                }

                // Sättigung
                if (saturation !== 0) {
                    const gray = 0.299 * cr + 0.587 * cg + 0.114 * cb;
                    cr = gray + (cr - gray) * (1 + saturation);
                    cg = gray + (cg - gray) * (1 + saturation);
                    cb = gray + (cb - gray) * (1 + saturation);
                }

                // Begrenzung 0-255
                cr = Math.max(0, Math.min(255, cr));
                cg = Math.max(0, Math.min(255, cg));
                cb = Math.max(0, Math.min(255, cb));

                // Wenn nicht im Highlight / nicht aktiv -> in Graustufen umwandeln und abdunkeln
                if (!isHighlighted) {
                    const grayVal = 0.299 * cr + 0.587 * cg + 0.114 * cb;
                    cr = grayVal * dimFactor;
                    cg = grayVal * dimFactor;
                    cb = grayVal * dimFactor;
                }

                data[i]     = cr;
                data[i + 1] = cg;
                data[i + 2] = cb;
            }

            ctx.putImageData(imgData, 0, 0);
            drawCanvasTransform();
        }

        function drawCanvasTransform() {
            canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        // --- Event Listeners für Filter & Schalter ---
        const controlsToWatch = ['toggle-r', 'toggle-g', 'toggle-b', 'range-tolerance', 'range-dim', 'range-brightness', 'range-contrast', 'range-saturation'];
        controlsToWatch.forEach(id => {
            document.getElementById(id).addEventListener('input', (e) => {
                // UI Label Update
                if (id === 'range-tolerance') document.getElementById('val-tolerance').innerText = e.target.value;
                if (id === 'range-dim') document.getElementById('val-dim').innerText = e.target.value;
                if (id === 'range-brightness') document.getElementById('val-brightness').innerText = e.target.value;
                if (id === 'range-contrast') document.getElementById('val-contrast').innerText = e.target.value;
                if (id === 'range-saturation') document.getElementById('val-saturation').innerText = e.target.value;
                
                processImage();
            });
        });

        // --- Bild Upload ---
        document.getElementById('btn-upload').addEventListener('click', () => document.getElementById('file-input').click());
        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    sourceImageWidth = img.width;
                    sourceImageHeight = img.height;
                    targetColor = null;
                    document.getElementById('isolation-preview-box').style.display = 'none';
                    document.getElementById('btn-reset-isolation').style.display = 'none';
                    resetViewAndProcess();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('btn-load-test').addEventListener('click', () => {
            targetColor = null;
            document.getElementById('isolation-preview-box').style.display = 'none';
            document.getElementById('btn-reset-isolation').style.display = 'none';
            loadTestImage();
        });

        // --- Kamera Integration ---
        const cameraModal = document.getElementById('camera-modal');
        const cameraVideo = document.getElementById('camera-video');

        document.getElementById('btn-open-camera').addEventListener('click', async () => {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                cameraVideo.srcObject = mediaStream;
                cameraModal.style.display = 'flex';
            } catch (err) {
                alert('Kamera konnte nicht geöffnet werden: ' + err.message);
            }
        });

        document.getElementById('btn-close-camera').addEventListener('click', stopCamera);

        function stopCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            cameraModal.style.display = 'none';
        }

        document.getElementById('btn-capture-photo').addEventListener('click', () => {
            const vCanvas = document.createElement('canvas');
            vCanvas.width = cameraVideo.videoWidth || 1280;
            vCanvas.height = cameraVideo.videoHeight || 720;
            const vCtx = vCanvas.getContext('2d');
            vCtx.drawImage(cameraVideo, 0, 0, vCanvas.width, vCanvas.height);

            const img = new Image();
            img.onload = () => {
                originalImage = img;
                sourceImageWidth = img.width;
                sourceImageHeight = img.height;
                targetColor = null;
                document.getElementById('isolation-preview-box').style.display = 'none';
                document.getElementById('btn-reset-isolation').style.display = 'none';
                stopCamera();
                resetViewAndProcess();
            };
            img.src = vCanvas.toDataURL();
        });

        // --- Bildgrößen-Anpassung ---
        const resizeModeSelect = document.getElementById('resize-mode');
        const widthLabel = document.getElementById('width-label');
        const heightContainer = document.getElementById('height-container');
        const resizeWidthInput = document.getElementById('resize-width');
        const resizeHeightInput = document.getElementById('resize-height');

        resizeModeSelect.addEventListener('change', () => {
            if (resizeModeSelect.value === 'percent') {
                widthLabel.innerText = 'Breite (%)';
                heightContainer.style.display = 'none';
                resizeWidthInput.value = '100';
            } else {
                widthLabel.innerText = 'Breite (px)';
                heightContainer.style.display = 'grid';
                if (originalImage) {
                    resizeWidthInput.value = sourceImageWidth;
                    resizeHeightInput.value = sourceImageHeight;
                }
            }
        });

        resizeWidthInput.addEventListener('input', () => {
            if (resizeModeSelect.value === 'pixel' && document.getElementById('aspect-ratio-lock').checked && originalImage) {
                const ratio = originalImage.height / originalImage.originalWidth || (sourceImageHeight / sourceImageWidth);
                resizeHeightInput.value = Math.round(resizeWidthInput.value * ratio);
            }
        });

        document.getElementById('btn-apply-resize').addEventListener('click', () => {
            if (!originalImage) return;
            let newW, newH;

            if (resizeModeSelect.value === 'percent') {
                const pct = parseFloat(resizeWidthInput.value) / 100;
                newW = Math.round(originalImage.width * pct);
                newH = Math.round(originalImage.height * pct);
            } else {
                newW = parseInt(resizeWidthInput.value);
                newH = parseInt(resizeHeightInput.value);
            }

            if (newW < 10 || newH < 10) {
                alert('Größe ist zu klein.');
                return;
            }

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = newW;
            tempCanvas.height = newH;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.drawImage(originalImage, 0, 0, newW, newH);

            const img = new Image();
            img.onload = () => {
                originalImage = img;
                sourceImageWidth = newW;
                sourceImageHeight = newH;
                resetViewAndProcess();
                alert(`Bildgröße erfolgreich auf ${newW}×${newH}px angepasst!`);
            };
            img.src = tempCanvas.toDataURL();
        });

        // --- Export & Speichern ---
        const exportFormatSelect = document.getElementById('export-format');
        const exportQualityRange = document.getElementById('export-quality');
        const jpgQualityGroup = document.getElementById('jpg-quality-group');

        exportFormatSelect.addEventListener('change', () => {
            jpgQualityGroup.style.display = exportFormatSelect.value === 'image/jpeg' ? 'flex' : 'none';
        });
        exportQualityRange.addEventListener('input', (e) => {
            document.getElementById('quality-val').innerText = e.target.value;
        });

        document.getElementById('btn-save').addEventListener('click', () => {
            if (!originalImage) return;
            const format = exportFormatSelect.value;
            const quality = parseInt(exportQualityRange.value) / 100;

            const dataUrl = canvas.toDataURL(format, quality);
            const ext = format === 'image/jpeg' ? 'jpg' : 'png';
            const link = document.createElement('a');
            link.download = `farb-analyse-${Date.now()}.${ext}`;
            link.href = dataUrl;
            link.click();
        });

        // --- Pipette / Farbisolation Aktivierung & Klick ---
        const btnPicker = document.getElementById('btn-picker');
        btnPicker.addEventListener('click', () => {
            pickerActive = !pickerActive;
            if (pickerActive) {
                btnPicker.style.background = '#ef4444';
                btnPicker.innerText = '🎯 Pipette aktiv (Klicken Sie ins Bild)';
                canvas.style.cursor = 'crosshair';
            } else {
                btnPicker.style.background = '#8b5cf6';
                btnPicker.innerText = '🎯 Farbe mit Pipette wählen';
                canvas.style.cursor = 'grab';
            }
        });

        canvas.addEventListener('click', (e) => {
            if (!pickerActive || !originalImage) return;

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            // Koordinaten auf die tatsächliche Canvas-Auflösung umrechnen
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const pixelX = Math.floor(clickX * scaleX);
            const pixelY = Math.floor(clickY * scaleY);

            if (pixelX >= 0 && pixelX < canvas.width && pixelY >= 0 && pixelY < canvas.height) {
                // Nur aktuellen Canvas-Zustand (inkl. aktiver Filter) abfragen
                const pData = ctx.getImageData(pixelX, pixelY, 1, 1).data;
                targetColor = { r: pData[0], g: pData[1], b: pData[2] };

                // UI aktualisieren
                const hex = '#' + [targetColor.r, targetColor.g, targetColor.b].map(x => x.toString(16).padStart(2, '0')).join('');
                document.getElementById('color-preview-sample').style.backgroundColor = hex;
                document.getElementById('color-info-text').innerText = `RGB(${targetColor.r}, ${targetColor.g}, ${targetColor.b})\nHEX: ${hex}`;
                document.getElementById('isolation-preview-box').style.display = 'flex';
                document.getElementById('btn-reset-isolation').style.display = 'block';

                // Pipette beenden
                pickerActive = false;
                btnPicker.style.background = '#8b5cf6';
                btnPicker.innerText = '🎯 Farbe mit Pipette wählen';
                canvas.style.cursor = 'grab';

                processImage();
            }
        });

        document.getElementById('btn-reset-isolation').addEventListener('click', () => {
            targetColor = null;
            document.getElementById('isolation-preview-box').style.display = 'none';
            document.getElementById('btn-reset-isolation').style.display = 'none';
            processImage();
        });

        // --- Zoom & Pan (Mausrad & Dragging) ---
        wrapper.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (!originalImage) return;
            const zoomIntensity = 1.1;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            let newScale = e.deltaY < 0 ? scale * zoomIntensity : scale / zoomIntensity;
            newScale = Math.max(0.1, Math.min(20, newScale));

            panX = mouseX - (mouseX - panX) * (newScale / scale);
            panY = mouseY - (mouseY - panY) * (newScale / scale);
            scale = newScale;

            drawCanvasTransform();
        }, { passive: false });

        wrapper.addEventListener('mousedown', (e) => {
            if (pickerActive) return;
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            drawCanvasTransform();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Initiales Testbild beim Start laden
        window.onload = () => {
            loadTestImage();
        };
    </script>
</body>
</html>
